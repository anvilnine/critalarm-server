name: CI

# This repo is public. CI runs on GitHub-hosted runners, never the self-hosted
# Mac: a `pull_request` trigger plus a self-hosted runner lets a stranger run
# their code on that machine. If you ever move a job back to `self-hosted`,
# drop the `pull_request` trigger with it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code. Without this block the token gets the
# repository's default permissions, which can include write.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Docker build
        run: docker build -t critalarm-server:ci .
