name: CI

# This repo is public. CI runs on GitHub-hosted runners, never the self-hosted
# Mac: a `pull_request` trigger plus a self-hosted runner lets a stranger run
# their code on that machine. If you ever move a job back to `self-hosted`,
# drop the `pull_request` trigger with it.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Docker build
        run: docker build -t critalarm-server:ci .
