name: Release

# Builds the image for amd64 and arm64 and pushes it to GitHub's registry.
# Pushes to main get the short sha and `latest`. A `v*` tag gets the semver
# tags as well, and only a `v*` tag deploys production.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/critalarm

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only a `v*` tag deploys production. A push to main builds `latest` and
    # `sha-*` and stops there. This is an alarm server: the thing that wakes
    # people up does not get replaced every time someone merges a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # How the deploy makes the host run the new code:
    #
    # The Coolify service pins its image through a variable,
    # `image: ghcr.io/anvilnine/critalarm:${CRITALARM_IMAGE_TAG}`, and the
    # server entry sets `pull_policy: always`. This job writes the released
    # version into that variable and then calls Coolify's deploy, which runs
    # `docker compose up -d --force-recreate`. `pull_policy: always` makes
    # compose fetch the tag from the registry first, so the container cannot
    # come back on a stale image that happened to be on the host.
    #
    # Do not swap the start call for the restart call with `latest=true`.
    # Coolify's restart stops the containers and fires a host-wide docker
    # cleanup in parallel with the pull. The cleanup deletes the image it is
    # still downloading, compose then has nothing to start, and production
    # stays down. Seen on 2026-09-16.
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      IMAGE_TAG_VARIABLE: CRITALARM_IMAGE_TAG

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are set
        run: |
          missing=""
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_SERVICE_UUID PRODUCTION_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See the Releasing section of README.md." >&2
            exit 1
          fi

      - name: Check the tag matches package.json
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME carries version $tag_version but package.json says $package_version." >&2
            echo "The running server reports package.json, so the two must agree. Cut releases with scripts/release.sh." >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Point the service at the new image
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/patch-env.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "{\"key\":\"$IMAGE_TAG_VARIABLE\",\"value\":\"${{ steps.version.outputs.version }}\",\"is_literal\":true}" \
            "$COOLIFY_URL/api/v1/services/$COOLIFY_SERVICE_UUID/envs")
          echo "HTTP $status"
          cat /tmp/patch-env.json
          echo
          case "$status" in
            2*) ;;
            *) echo "Coolify refused the image tag update." >&2; exit 1 ;;
          esac

      # The deploy call, not the start call. Coolify's `/start` answers
      # `{"message":"Service is already running."}` with a 400 when the service
      # is up, which is every deploy after the first. `/deploy` runs
      # `docker compose up -d --force-recreate` on a running service, so the
      # container comes back on the image the variable now points at.
      #
      # Still not the restart call with `latest=true`. That one stops the
      # containers and fires a host-wide docker cleanup next to the pull, the
      # cleanup deletes the image mid-download, and production stays down.
      - name: Recreate the containers on the new image
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=true")
          echo "HTTP $status"
          cat /tmp/deploy.json
          echo
          case "$status" in
            2*) ;;
            *) echo "Coolify refused the deploy request." >&2; exit 1 ;;
          esac

      - name: Wait for production to report the new version
        # A 200 from Coolify only means the job was queued. The old container
        # answers /v1/info too, with the old version, so this step is what
        # tells a real deploy from a stale one. It fails the workflow if the
        # version never changes.
        run: |
          set -uo pipefail
          expected='${{ steps.version.outputs.version }}'
          deadline=$(( $(date +%s) + 300 ))
          read_version='
            const url = process.env.PRODUCTION_BASE_URL + "/v1/info";
            fetch(url, { signal: AbortSignal.timeout(10000) })
              .then((r) => r.json())
              .then((info) => process.stdout.write(String(info.version ?? "")))
              .catch(() => {});
          '
          while [ "$(date +%s)" -lt "$deadline" ]; do
            reported=$(node -e "$read_version" || true)
            echo "$(date -u +%H:%M:%S) /v1/info reports '${reported:-nothing}', waiting for '$expected'"
            if [ "$reported" = "$expected" ]; then
              echo "Production is running $expected."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported $expected within 5 minutes." >&2
          echo "Check the service in Coolify before assuming the release shipped." >&2
          exit 1
