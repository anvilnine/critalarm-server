name: Release

# Builds the image for amd64 and arm64 and pushes it to GitHub's registry.
# Pushes to main get the short sha and `latest`. A `v*` tag gets the semver
# tags as well, and only a `v*` tag deploys production. Nothing is published
# until the test job below has passed on the same commit.
on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/critalarm

jobs:
  # The same checks as ci.yml, run here so the image waits on them. CI runs in
  # its own workflow, and a workflow cannot `needs:` a job in another one.
  # Without this, `latest` and `sha-*` went out on every push to main whether
  # the tests passed or not, and a tag pushed straight after a merge could
  # deploy before CI had finished.
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # amd64 only, because that is what the hosted server runs and the deploy waits
  # on this job. arm64 is built next door in publish-arm64: it goes through QEMU
  # and takes the better part of an hour, which is not a wait worth putting in
  # front of a fix to an alarm server.
  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # The deploy job pins the image by this digest rather than by tag alone.
    # A tag can resolve to a layer the host already has. A digest the host has
    # never seen can only come from the registry.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # arm64 for anyone self-hosting on a Pi or an ARM VPS. Nothing waits on it.
  # It builds under emulation, which recompiles better-sqlite3 from source and
  # takes roughly 45 minutes, so it runs next to the deploy rather than before
  # it. When it lands it folds arm64 into the tags publish already pushed, and
  # those tags go from amd64-only to multi-arch in place.
  publish-arm64:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the same tags publish used
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build arm64 under a scratch tag
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:arm64-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fold arm64 into the published tags
        run: |
          set -euo pipefail
          scratch="$IMAGE:arm64-$GITHUB_SHA"
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] || continue
            # Sources are the tag as it stands (amd64) and the arm64 scratch
            # tag. imagetools writes a manifest list carrying both.
            docker buildx imagetools create -t "$tag" "$tag" "$scratch"
            echo "folded arm64 into $tag"
          done

  deploy:
    # Only a `v*` tag deploys production. A push to main builds `latest` and
    # `sha-*` and stops there. This is an alarm server: the thing that wakes
    # people up does not get replaced every time someone merges a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # How the deploy makes the host run the new code:
    #
    # The Coolify service pins its image through a variable,
    # `image: ghcr.io/anvilnine/critalarm:${CRITALARM_IMAGE_TAG}`. This job
    # writes `<version>@sha256:<digest>` into that variable and then calls
    # Coolify's deploy, which runs `docker compose up -d --force-recreate`.
    #
    # The version on its own is not enough. The server entry does carry
    # `pull_policy: always`, read off the Coolify compose box on 2026-09-18,
    # and Coolify's deploy ignores it. It recreates the containers from the
    # layer already on the host, so the tag string moves and the running code
    # does not. Releases 0.1.5 and 0.1.6 both came back on old code that way
    # and a human had to click Advanced > Pull Latest Images & Restart.
    #
    # The digest is what forces the fetch. The host has never seen the new
    # digest, so compose has no local image to reuse and has to pull before it
    # can start the container. Nothing here depends on Coolify honouring the
    # pull policy.
    #
    # Do not swap the start call for the restart call with `latest=true`.
    # Coolify's restart stops the containers and fires a host-wide docker
    # cleanup in parallel with the pull. The cleanup deletes the image it is
    # still downloading, compose then has nothing to start, and production
    # stays down. Seen on 2026-09-16.
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      IMAGE_TAG_VARIABLE: CRITALARM_IMAGE_TAG

    steps:
      # Full history, so the next step can tell whether the tag is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A `v*` tag can be pushed on any commit, including one that never went
      # through a pull request. Only a commit that is already on main deploys.
      - name: Check the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $commit, which is not on main. Merge it to main first, then tag." >&2
            exit 1
          fi
          echo "$commit is on main."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the secrets are set
        run: |
          missing=""
          for name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_SERVICE_UUID PRODUCTION_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See the Releasing section of README.md." >&2
            exit 1
          fi

      - name: Check the tag matches package.json
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME carries version $tag_version but package.json says $package_version." >&2
            echo "The running server reports package.json, so the two must agree. Cut releases with scripts/release.sh." >&2
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Point the service at the new image
        run: |
          set -euo pipefail
          digest='${{ needs.publish.outputs.digest }}'
          case "$digest" in
            sha256:*) ;;
            *) echo "The publish job handed over no image digest, so the deploy would pull nothing new." >&2; exit 1 ;;
          esac
          reference="${{ steps.version.outputs.version }}@$digest"
          echo "Pinning $IMAGE_TAG_VARIABLE to $reference"
          # The response body is thrown away, never printed: this repo is
          # public and so are its workflow logs. The status says enough.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d "{\"key\":\"$IMAGE_TAG_VARIABLE\",\"value\":\"$reference\",\"is_literal\":true}" \
            "$COOLIFY_URL/api/v1/services/$COOLIFY_SERVICE_UUID/envs")
          echo "HTTP $status"
          case "$status" in
            2*) echo "Coolify took the image tag update." ;;
            *) echo "Coolify refused the image tag update." >&2; exit 1 ;;
          esac

      # The deploy call, not the start call. Coolify's `/start` answers
      # `{"message":"Service is already running."}` with a 400 when the service
      # is up, which is every deploy after the first. `/deploy` runs
      # `docker compose up -d --force-recreate` on a running service, and the
      # digest in the variable is one the host does not have, so compose pulls
      # it before the container comes back.
      #
      # Still not the restart call with `latest=true`. That one stops the
      # containers and fires a host-wide docker cleanup next to the pull, the
      # cleanup deletes the image mid-download, and production stays down.
      - name: Recreate the containers on the new image
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Accept: application/json' \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=true")
          echo "HTTP $status"
          case "$status" in
            2*) echo "Coolify queued the deploy." ;;
            *) echo "Coolify refused the deploy request." >&2; exit 1 ;;
          esac

      - name: Wait for production to report the new version
        # A 200 from Coolify only means the job was queued. The old container
        # answers /v1/info too, with the old version, so this step is what
        # tells a real deploy from a stale one. It fails the workflow if the
        # version never changes.
        run: |
          set -uo pipefail
          expected='${{ steps.version.outputs.version }}'
          deadline=$(( $(date +%s) + 300 ))
          read_version='
            const url = process.env.PRODUCTION_BASE_URL + "/v1/info";
            fetch(url, { signal: AbortSignal.timeout(10000) })
              .then((r) => r.json())
              .then((info) => process.stdout.write(String(info.version ?? "")))
              .catch(() => {});
          '
          while [ "$(date +%s)" -lt "$deadline" ]; do
            reported=$(node -e "$read_version" || true)
            echo "$(date -u +%H:%M:%S) /v1/info reports '${reported:-nothing}', waiting for '$expected'"
            if [ "$reported" = "$expected" ]; then
              echo "Production is running $expected."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported $expected within 5 minutes." >&2
          echo "Check the service in Coolify before assuming the release shipped." >&2
          exit 1
